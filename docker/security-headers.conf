# Cabeceras de seguridad de la SPA. Se incluyen en cada location de nginx.conf porque nginx
# descarta los add_header del bloque server en cuanto una location define los suyos.
# HSTS solo tiene efecto cuando la respuesta llega por HTTPS (a través del proxy TLS del host)
# y repite la política del backend (settings/prod.py) para que el dominio tenga una sola.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# Ninguna página de otro sitio puede incrustar la interfaz clínica (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La cámara se permite solo a la propia app: el lector de QR de cunas la usa
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

# Servidor estático de Poki Koa (SPA). Va detrás del proxy TLS del host, que enruta /api y /ws
# al backend; este contenedor solo sirve dist/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Detrás del proxy, las redirecciones no deben llevar el host ni el puerto internos
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Archivos con hash de contenido de Vite: nunca cambian, caché de un año.
    # Un asset inexistente responde 404 y no index.html: devolver HTML como JS rompería la
    # carga con un error de MIME y quedaría cacheado como immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # El HTML siempre se revalida para que un despliegue nuevo se vea de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: cualquier ruta sin archivo (p. ej. /pacientes/12 o /qr/cuna/C-01) carga
    # index.html y React Router resuelve la vista
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

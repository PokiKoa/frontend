name: CI Poki Koa Frontend

on:
  push:
    branches: [main, develop, 'rewrite/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'rewrite/**']

jobs:
  verificacion:
    name: Formato, lint, compilación y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias desde package-lock.json
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Compilar (tsc + vite)
        run: npm run build

      - name: Pruebas con cobertura
        run: npm run test:coverage
